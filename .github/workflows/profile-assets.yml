name: Profile assets

# Regenerates the stack icons, WakaTime card and contribution snake, and publishes them to
# the `output` branch so the daily refresh never adds commits to main.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stack icons
        run: node scripts/stack-card.mjs dist/stack.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: WakaTime card
        run: node scripts/wakatime-card.mjs dist/wakatime.svg

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#4ADE80&color_dots=#161616,#0E3B22,#166534,#22A355,#4ADE80
            dist/snake-light.svg?color_snake=#15803D&color_dots=#EBEDF0,#BBF7D0,#4ADE80,#22A355,#166534

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

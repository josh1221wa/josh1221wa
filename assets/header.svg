<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Joshua Varghese Thomji — Data Analyst &amp; AI Engineer, MSc CS (AI) at Leiden University">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="fade" cx="0.85" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0A0A0A"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#1F1F1F"/>

  <!-- status bar -->
  <g class="mono" font-size="13" letter-spacing="1.5">
    <circle class="pulse" cx="56" cy="38" r="4" fill="#4ADE80"/>
    <text x="70" y="42" fill="#666">SYS_STATUS: <tspan fill="#4ADE80">OPTIMAL</tspan></text>
    <text x="330" y="42" fill="#666">LOC: <tspan fill="#BBB">52.16°N, 4.49°E</tspan></text>
    <text x="600" y="42" fill="#666">NODE: <tspan fill="#BBB">LEIDEN_UNIVERSITY</tspan></text>
    <text x="1152" y="42" fill="#444" text-anchor="end">0xE45CF246 · 6740:019A</text>
  </g>
  <line x1="48" y1="62" x2="1152" y2="62" stroke="#1F1F1F"/>

  <!-- identity -->
  <text x="48" y="112" class="mono" font-size="15" fill="#4ADE80" letter-spacing="2">[ 0x00 ]  <tspan fill="#666">~/josh1221wa $</tspan> <tspan fill="#F0F0F0">whoami</tspan><tspan class="cursor" fill="#4ADE80">▍</tspan></text>
  <text x="44" y="182" class="sans" font-size="66" font-weight="700" fill="#F0F0F0" letter-spacing="-1.5">Joshua Varghese Thomji</text>
  <text x="48" y="222" class="mono" font-size="17" fill="#4ADE80" letter-spacing="2.5">DATA ANALYST &amp; AI ENGINEER  <tspan fill="#444">|</tspan>  MSC CS (AI) @ LEIDEN</text>
  <text class="sans" font-size="19" fill="#8A8A8A">
    <tspan x="48" y="264">LLM evaluation &amp; fine-tuning, with published research from</tspan>
    <tspan x="48" y="290">document-analysis models to Gaia-based astrophysics.</tspan>
  </text>

  <!-- binary star system: a nod to the HD 25811 / HIP 16348 papers -->
  <g transform="rotate(-18 1010 190)">
    <ellipse cx="1010" cy="190" rx="118" ry="44" fill="none" stroke="#2A2A2A" stroke-dasharray="3 5"/>
    <ellipse cx="1010" cy="190" rx="46" ry="17" fill="none" stroke="#2A2A2A" stroke-dasharray="3 5"/>
    <circle cx="1010" cy="190" r="1.6" fill="#555"/>
    <circle r="9" fill="#4ADE80" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M1056 190 a46 17 0 1 0 -92 0 a46 17 0 1 0 92 0"/>
    </circle>
    <circle r="5" fill="#F0F0F0" filter="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" path="M892 190 a118 44 0 1 0 236 0 a118 44 0 1 0 -236 0"/>
    </circle>
  </g>
  <g fill="#F0F0F0">
    <circle cx="880" cy="96" r="1" opacity="0.5"/>
    <circle cx="1128" cy="110" r="1.2" opacity="0.4"/>
    <circle cx="1150" cy="262" r="1" opacity="0.5"/>
    <circle cx="905" cy="288" r="1.3" opacity="0.3"/>
    <circle cx="1080" cy="84" r="0.9" opacity="0.6"/>
    <circle cx="960" cy="300" r="0.8" opacity="0.5"/>
  </g>

  <!-- ticker -->
  <line x1="48" y1="312" x2="1152" y2="312" stroke="#1F1F1F"/>
  <text x="48" y="330" class="mono" font-size="11" fill="#555" letter-spacing="1.2">LOADING_RESEARCH_DATABASE... <tspan fill="#4ADE80">[OK]</tspan>    SYNCING_LLM_EVALS... <tspan fill="#4ADE80">[OK]</tspan>    RESOLVING_BINARY_ORBITS... <tspan fill="#4ADE80">[OK]</tspan></text>
</svg>
